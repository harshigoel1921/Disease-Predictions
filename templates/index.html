<!DOCTYPE html>
<html>
<head>
    <title>Disease Prediction</title>
    <style>
        body { font-family: Arial; text-align: center; }
        input, select { margin: 5px; padding: 8px; width: 200px; }
        button { padding: 10px 20px; }
        .section { display: none; }
    </style>

    <script>
        function showFields() {
            let disease = document.getElementById("disease").value;

            document.getElementById("heart").style.display = "none";
            document.getElementById("diabetes").style.display = "none";
            document.getElementById("liver").style.display = "none";

            document.getElementById(disease).style.display = "block";
        }
    </script>
</head>

<body>

<h2>Disease Prediction System</h2>

<form action="/predict" method="post">

    <select name="disease" id="disease" onchange="showFields()">
        <option value="">--Select Disease--</option>
        <option value="heart">Heart</option>
        <option value="diabetes">Diabetes</option>
        <option value="liver">Liver</option>
    </select>

    <!-- HEART -->
    <div id="heart" class="section">
        <h3>Heart Inputs</h3>
        <input name="age" placeholder="Age">
        <input name="sex" placeholder="Sex (0/1)">
        <input name="cp" placeholder="Chest Pain">
        <input name="trestbps" placeholder="BP">
        <input name="chol" placeholder="Cholesterol">
        <input name="fbs" placeholder="Fasting Sugar">
        <input name="restecg" placeholder="ECG">
        <input name="thalach" placeholder="Max HR">
        <input name="exang" placeholder="Exercise Angina">
        <input name="oldpeak" placeholder="Oldpeak">
        <input name="slope" placeholder="Slope">
        <input name="ca" placeholder="CA">
        <input name="thal" placeholder="Thal">
    </div>

    <!-- DIABETES -->
    <div id="diabetes" class="section">
        <h3>Diabetes Inputs</h3>
        <input name="Pregnancies" placeholder="Pregnancies">
        <input name="Glucose" placeholder="Glucose">
        <input name="BloodPressure" placeholder="BP">
        <input name="SkinThickness" placeholder="SkinThickness">
        <input name="Insulin" placeholder="Insulin">
        <input name="BMI" placeholder="BMI">
        <input name="DPF" placeholder="Pedigree">
        <input name="Age" placeholder="Age">
    </div>

    <!-- LIVER -->
    <div id="liver" class="section">
        <h3>Liver Inputs</h3>
        <input name="Age" placeholder="Age">
        <input name="Gender" placeholder="Gender (0/1)">
        <input name="TB" placeholder="Total Bilirubin">
        <input name="DB" placeholder="Direct Bilirubin">
        <input name="AP" placeholder="Alkaline">
        <input name="ALT" placeholder="ALT">
        <input name="AST" placeholder="AST">
        <input name="TP" placeholder="Total Proteins">
        <input name="Albumin" placeholder="Albumin">
        <input name="AGR" placeholder="A/G Ratio">
    </div>

    <br><br>
    <button type="submit">Predict</button>

</form>

<h2>{{ prediction_text }}</h2>

</body>
</html>
